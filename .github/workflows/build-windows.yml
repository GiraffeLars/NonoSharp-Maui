# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build and Test API and build MAUI project

on:
  push:
    branches: [ "main" ]

env:
  GAME_PROJECT: src/Picross.Game/Picross.Game.csproj
  TEST_PROJECT: tests/Picross.Game.Tests/Picross.Game.Tests.csproj
  MAUI_PROJECT: src/Picross.Maui/Picross.Maui.csproj

jobs:
  build-and-test-api:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: |-
        dotnet restore ${{ env.GAME_PROJECT }}
        dotnet restore ${{ env.TEST_PROJECT }}
    - name: Build API project
      run: dotnet build -c Release --no-restore ${{ env.GAME_PROJECT }}
    - name: Build Test project
      run: dotnet build -c Release --no-restore ${{ env.TEST_PROJECT }}
    - name: Test
      run: dotnet test -c Release --no-build --verbosity normal ${{ env.TEST_PROJECT }}

  changed:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for changes in MAUI project
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q 'src/Picross.Maui/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  build-maui-windows:
    needs: build-and-test-api
    needs: changed

    if: needs.changed.outputs.changed == 'true'

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Install .NET MAUI workload
      run: dotnet workload install maui
    - name: Restore dependencies
      run: |-
        dotnet restore ${{ env.GAME_PROJECT }}
        dotnet restore ${{ env.MAUI_PROJECT }}
    - name: Build API project
      run: dotnet build -c Release --no-restore ${{ env.GAME_PROJECT }}
    - name: Build MAUI project
      run: dotnet build -c Release -f net10.0-windows10.0.19041.0 ${{ env.MAUI_PROJECT }}
