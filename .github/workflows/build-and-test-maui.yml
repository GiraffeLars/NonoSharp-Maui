# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build .NET MAUI project for Windows

on:
  workflow_run:
    workflows: ["Build and Test API project"]
    types:
      - completed

env:
  GAME_PROJECT: src/Picross.Game/Picross.Game.csproj
  MAUI_PROJECT: src/Picross.Maui/Picross.Maui.csproj

jobs:
  build-maui-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: |-
        dotnet restore ${{ env.GAME_PROJECT }}
        dotnet restore ${{ env.MAUI_PROJECT }}
    - name: Build API project
      run: dotnet build -c Release --no-restore ${{ env.GAME_PROJECT }}
    - name: Build MAUI project
      run: dotnet build -c Release -f net-10.0-windows10.0.19041.0 --no-restore ${{ env.MAUI_PROJECT }}

